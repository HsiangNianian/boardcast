[package]
name = "boardcast"
version = "0.12.0"
description = "Talk, and the whiteboard draws itself."
authors = ["HsiangNianian"]
license = "MIT"
edition = "2021"

[lib]
name = "boardcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 模型下载：断点续传、边下边算 sha256
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
fs4 = "1"
# 语音输入：麦克风采集 + 断句 + 识别（sherpa-onnx 静态链接，构建时下载官方预编译库）
# Linux 上走 PulseAudio（PipeWire 也兼容）：列出来的是真实的麦克风，而不是一堆 ALSA 插件
cpal = { version = "0.18", features = ["pulseaudio"] }
sherpa-onnx = "2.0.1"
# 导出：系统的另存为对话框；前端把文件内容用 base64 传过来
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-updater = "2"

# 应用崩溃或被强制结束时，让 llama-server 跟着退出，不留下占着显存的孤儿进程
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
