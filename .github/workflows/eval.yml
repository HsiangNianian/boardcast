name: Eval

on:
  # A push or pull request runs only the evaluations what changed concerns (the changes job); these paths
  # leave out what concerns neither. A schedule or a manual run runs whichever it asks for, as before.
  push:
    branches: [main]
    paths: &paths
      - 'crates/agent/**'
      - 'crates/board/**'
      - 'crates/tools/Cargo.toml'
      - 'crates/tools/src/main.rs'
      - 'crates/tools/src/agent_eval.rs'
      - 'crates/tools/src/eval_report.rs'
      - 'crates/tools/src/model_flags.rs'
      - 'crates/tools/src/score.rs'
      - 'crates/tools/src/voice_files.rs'
      - 'crates/tools/src/fetch.rs'
      - 'crates/asr-eval/**'
      - 'crates/audio/**'
      - 'assets/dictionaries/**'
      - 'assets/glyphs/**'
      - 'eval/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/eval.yml'
      - '!**/README.md'
  pull_request:
    paths: *paths
  schedule:
    - cron: '30 2 * * 1'
    - cron: '30 2 * * 4'
  workflow_dispatch:
    inputs:
      meeting_asr:
        description: Long multilingual meetings (ASR only)
        type: boolean
        default: false
      full_asr:
        description: The full ASR corpus rather than the quick samples
        type: boolean
        default: false
      model_url:
        description: Board evaluation GGUF URL
        default: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      label:
        description: Board evaluation model label
        default: qwen3.5-4b-q4km-cpu

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_BUILD: b11954
  # Gate on the desktop's recommended model; other candidates can use workflow_dispatch inputs.
  MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf' }}
  LABEL: ${{ inputs.label || 'qwen3.5-4b-q4km-cpu' }}

jobs:
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      board: ${{ steps.filter.outputs.board }}
      asr: ${{ steps.filter.outputs.asr }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # The board model's prompts and rules, the board it writes on and the text widths it lays out
            # with, the evaluation and its cases.
            board:
              - 'crates/agent/**'
              - 'crates/board/**'
              - 'crates/tools/src/main.rs'
              - 'crates/tools/src/agent_eval.rs'
              - 'crates/tools/src/eval_report.rs'
              - 'crates/tools/src/model_flags.rs'
              - 'crates/tools/src/score.rs'
              - 'crates/tools/Cargo.toml'
              - 'assets/dictionaries/**'
              - 'assets/glyphs/**'
              - 'eval/*.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/eval.yml'
              - '!**/README.md'
            # Hearing: the audio crate, the speech models it is given, telling speakers apart, and the corpus.
            asr:
              - 'crates/asr-eval/**'
              - 'crates/audio/**'
              - 'crates/board/src/speakers.rs'
              - 'crates/board/Cargo.toml'
              - 'crates/tools/src/voice_files.rs'
              - 'crates/tools/src/fetch.rs'
              - 'eval/asr/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/eval.yml'
              - '!**/README.md'

  board:
    name: text to board
    needs: changes
    # Not on a schedule, which is for hearing; on a push or pull request, only when it concerns the board.
    if: ${{ !cancelled() && github.event_name != 'schedule' && inputs.meeting_asr != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.board == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Reading earlier runs' reports for the trend needs to list and download this repository's artifacts.
    permissions:
      contents: read
      actions: read
    env:
      # A remote model to compare with, only when the repository has its key: forks and other repositories run
      # without it. Prices per 1M tokens for the report's cost (api-docs.deepseek.com, 2026-11-13, peak rates):
      # input from cache, input not cached, output.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_PRICE: 0.006,0.30,1.20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p boardcast-tools
      # The stroke data the layout check measures with.
      - run: target/release/boardcast-tools fetch glyphs

      - name: Cache llama.cpp and model
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/llama
            ~/models
          key: eval-${{ env.LLAMA_BUILD }}-${{ hashFiles('.github/workflows/eval.yml') }}-${{ env.MODEL_URL }}

      - name: Download llama.cpp and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/llama ~/models
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | tar -xz -C ~/llama
          curl -fL --retry 3 -o ~/models/model.gguf "$MODEL_URL"

      - name: Start llama-server
        run: |
          server=$(find ~/llama -type f -name llama-server | head -1)
          chmod +x "$server"
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          nohup "$server" -m ~/models/model.gguf --host 127.0.0.1 --port 8080 -c 4096 --jinja -np 1 > ~/llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          cat ~/llama-server.log
          exit 1

      # The board model as the app runs it. Transcript revisions are not in the GPUI app yet, so
      # eval/revisions.json waits for them (#150).
      - run: target/release/boardcast-tools agent-eval . board-dev.json --llm http://127.0.0.1:8080 --set dev --label "$LABEL"
      - run: target/release/boardcast-tools agent-eval . board-pointing.json --llm http://127.0.0.1:8080 --set pointing --label "$LABEL"

      # The same cases on DeepSeek, for the report's comparison and cost: about $0.03 a run.
      - name: Remote model (DeepSeek)
        if: ${{ !cancelled() && env.DEEPSEEK_API_KEY != '' }}
        run: |
          target/release/boardcast-tools agent-eval . remote-dev.json --deepseek --set dev --workers 4
          target/release/boardcast-tools agent-eval . remote-pointing.json --deepseek --set pointing --workers 4

      # Earlier runs on main, the last of each day for 30 days, for the report's trend.
      - name: Earlier reports
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/history
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=eval-report&per_page=100" \
            -q '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | "\(.created_at[0:10]) \(.created_at) \(.id)"' \
            | sort | awk '{ last[$1] = $3 } END { for (d in last) print last[d] }' > ~/history/ids || true
          while read -r id; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o ~/history/a.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" \
              && unzip -qo ~/history/a.zip -d ~/history/"$id" && rm -f ~/history/a.zip || true
          done < ~/history/ids
          echo "$(wc -l < ~/history/ids) earlier days"

      # The report as a page and a PDF, beside the Markdown reports in the artifact. Chinese case names need a
      # CJK font the runner does not have.
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk > /dev/null
          price=()
          [ -n "$DEEPSEEK_API_KEY" ] && price=(--price "deepseek=$DEEPSEEK_PRICE")
          target/release/boardcast-tools eval-report . eval/reports/board-eval.html --history ~/history "${price[@]}" eval/reports/*.json
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$PWD/eval/reports/board-eval.pdf" "file://$PWD/eval/reports/board-eval.html"
          ls -l eval/reports/board-eval.pdf

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-report
          path: |
            eval/reports/
            ~/llama-server.log

  asr:
    name: ASR · ${{ matrix.engine }} · VAD ${{ matrix.vad }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.asr == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app's own hearing, whose speech checks fail the run; then SenseVoice alone, as controls.
          - { engine: routed, vad: 'on' }
          - { engine: sensevoice, vad: 'on' }
          - { engine: sensevoice, vad: 'off' }
    env:
      ASR_SUITE: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 'meetings' || (github.event_name == 'schedule' || inputs.full_asr == true) && 'full' || 'quick' }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr-linux
      - run: cargo build --release -p boardcast-asr-eval
      - uses: actions/cache@v5
        with:
          path: eval/asr/.data
          key: asr-audio-${{ env.ASR_SUITE }}-${{ hashFiles('eval/asr/corpus.json', 'eval/asr/meetings.json') }}
      - uses: actions/cache@v5
        with:
          path: resources/voice
          key: asr-voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      # The speech models the packages carry.
      - run: cargo run -q --release -p boardcast-tools -- fetch voice
      # Both steps check cached files too: missing or damaged audio must never quietly skip a recording.
      - run: target/release/asr-eval download . --suite "$ASR_SUITE"
      - run: target/release/asr-eval run . --suite "$ASR_SUITE" --engine "${{ matrix.engine }}" --vad "${{ matrix.vad }}" --output "eval/reports/asr/${{ matrix.engine }}-vad-${{ matrix.vad }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: asr-${{ matrix.engine }}-vad-${{ matrix.vad }}
          path: eval/reports/asr/
          if-no-files-found: warn
          retention-days: 30

  asr-comparison:
    name: ASR comparison
    needs: asr
    # Also after some failed, to compare what there is; not when hearing was not evaluated at all.
    if: ${{ !cancelled() && needs.asr.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr-linux
      - run: cargo build --release -p boardcast-asr-eval
      - uses: actions/download-artifact@v7
        with:
          pattern: asr-*
          path: eval/reports/asr-ci
          merge-multiple: true
      - name: Compare the runs
        run: target/release/asr-eval compare eval/reports/asr-ci/*/report.json > eval/reports/asr-ci/comparison.md
      - uses: actions/upload-artifact@v6
        with:
          name: asr-comparison
          path: eval/reports/asr-ci/comparison.md
          retention-days: 30
