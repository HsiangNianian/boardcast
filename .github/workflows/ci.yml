name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · unit tests · web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop:
    name: desktop · ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys 把下载的预编译库放在 target/sherpa-onnx-prebuilt/，rust-cache 默认不缓存这里，
      # 却会恢复它的构建脚本结果，于是 cargo 以为库已经就位、链接时找不到。
      # 先清掉这个包，让构建脚本每次都确认一遍库在不在（在就不重新下载）。
      - name: Make sure the sherpa-onnx prebuilt libs are present
        shell: bash
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      # 冒烟测试：打进安装包的 llama-server 在这个平台上能跑起来、能列出设备
      - name: Smoke-test bundled llama-server
        shell: bash
        run: |
          exe=src-tauri/llama/llama-server
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --list-devices
          du -sh src-tauri/llama
      # 语音识别的测试要用真模型和一段测试音频（约 240 MB，缓存起来）
      - name: Cache voice models
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: voice-models
          key: voice-sensevoice-2024-07-17-silero-v4
      - name: Download voice models
        if: steps.voice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          hf=https://huggingface.co
          sv=$hf/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          mkdir -p voice-models/voice/sense-voice
          curl -fL --retry 3 -o voice-models/voice/sense-voice/model.int8.onnx $sv/model.int8.onnx
          curl -fL --retry 3 -o voice-models/voice/sense-voice/tokens.txt $sv/tokens.txt
          curl -fL --retry 3 -o voice-models/voice/silero_vad.onnx $hf/csukuangfj/vad/resolve/main/silero_vad.onnx
          curl -fL --retry 3 -o voice-models/zh.wav $sv/test_wavs/zh.wav
      # Rust 测试：模型下载器（假的 HTTP 服务：换源、断线续传、校验失败、取消、磁盘空间），
      # 语音识别（真模型认一段中文、两句话按停顿切开、静音不出字）
      - name: Rust tests
        shell: bash
        run: BOARDCAST_VOICE_DIR="$PWD/voice-models" cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
