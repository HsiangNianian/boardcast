[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.34.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Field order is kept: the migration hash must match what JSON.stringify produces.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
alcyo-board = { path = "crates/board" }
alcyo-audio = { path = "crates/audio" }
alcyo-keep = { path = "crates/keep" }
alcyo-share = { path = "crates/share" }
alcyo-agent = { path = "crates/agent" }
alcyo-meetings = { path = "crates/meetings" }
alcyo-models = { path = "crates/models" }
alcyo-export = { path = "crates/export" }
alcyo-fonts = { path = "crates/fonts" }
alcyo-import = { path = "crates/import" }
alcyo-update = { path = "crates/update" }
alcyo-search = { path = "crates/search" }

[profile.dev]
opt-level = 1
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# The website is downloaded by every visitor, so it is built for size.
[profile.release.package.alcyo-site]
opt-level = "s"

[profile.release.package.alcyo-demo]
opt-level = "s"

# Our fork of sherpa-onnx: 2.0.1 with Nemotron-3-Diarization (k2-fsa/sherpa-onnx#4032) and streaming speaker
# diarization on top (#292). Its prebuilt libraries come from the same tag's release, checked against
# .cargo/sherpa-onnx.sha256; see .cargo/config.toml. A new tag changes the tag here, the URL there, and that file.
[patch.crates-io]
sherpa-onnx = { git = "https://github.com/HsiangNianian/sherpa-onnx", tag = "alcyo-2.0.1-3" }
sherpa-onnx-sys = { git = "https://github.com/HsiangNianian/sherpa-onnx", tag = "alcyo-2.0.1-3" }
