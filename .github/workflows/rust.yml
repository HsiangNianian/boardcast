name: Rust

on:
  push:
    branches: [main]
    paths: &paths
      - 'crates/**'
      - 'assets/**'
      # The cases the crates' tests read.
      - 'eval/follow-cases.json'
      - 'eval/phonetic-cases.json'
      - 'eval/summary-cases.json'
      - 'packaging/**'
      - 'scripts/build-apple-speech.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - '.github/workflows/rust.yml'
      # The website and the web demo, and documents, have their own workflow or none.
      - '!crates/site/**'
      - '!crates/site-gen/**'
      - '!crates/demo/**'
      - '!crates/asr-eval/**'
      - '!**/README.md'
  pull_request:
    paths: *paths

# A pull request pushed again stops the run for what it replaced; runs on main all finish.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs what changed concerns: the crates' tests for the crates, and each platform's package for
  # the app and that platform's packaging. The workflow's own paths leave out what concerns none.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # What the app is built from. The evaluation crate and the website's are not part of it.
            app: &app
              - 'crates/**'
              - 'assets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust.yml'
              - '!crates/site/**'
              - '!crates/site-gen/**'
              - '!crates/demo/**'
              - '!crates/asr-eval/**'
              - '!**/README.md'
            # The crates the core job tests, and the cases their tests read; not the window or audio.
            core:
              - *app
              - 'eval/follow-cases.json'
              - 'eval/phonetic-cases.json'
              - 'eval/summary-cases.json'
              - '!crates/ui/**'
              - '!crates/audio/**'
            linux:
              - *app
              - 'LICENSE'
              - 'packaging/models.sh'
              - 'packaging/icons/**'
              - 'packaging/linux/**'
            macos:
              - *app
              - 'LICENSE'
              - 'packaging/models.sh'
              - 'packaging/icons/**'
              - 'packaging/macos/**'
              - 'scripts/build-apple-speech.sh'
            windows:
              - *app
              - 'LICENSE'
              - 'packaging/models.sh'
              - 'packaging/windows/**'

  core:
    name: core crates
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The window and audio crates need system libraries and native downloads, and have no tests yet.
      - run: cargo run -q -p boardcast-tools -- fetch pdfium
      - run: cargo test -p boardcast-board -p boardcast-agent -p boardcast-meetings -p boardcast-models -p boardcast-export -p boardcast-import -p boardcast-update -p boardcast-tools
      - name: Check the recorded boards for layout defects
        run: cargo run --release -p boardcast-tools -- check . --all-demos --tidy

  package:
    name: linux package
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    # An older base than developers use, so the package runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - name: Cache the meeting search model
        uses: actions/cache@v4
        with:
          path: resources/search
          key: search-${{ hashFiles('crates/models/src/lib.rs') }}
      # The script ends by running each packaged app's self-check. A second variant checks the model selection.
      - run: sh packaging/linux/package.sh
        env:
          VARIANTS: all ja
      # Its own target folder: the cache keeps compiled crates but not the speech library they were
      # built against, so rebuilding that crate in the restored folder cannot find it.
      - name: How speech is heard, with the packaged models
        run: cargo test -p boardcast-audio
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/resources/voice
          CARGO_TARGET_DIR: ${{ runner.temp }}/audio-tests
      - name: Install from the package and check again
        run: |
          mkdir unpacked
          tar -xzf target/package/boardcast-*-linux.tar.gz -C unpacked
          PREFIX="$PWD/prefix" sh unpacked/*/install.sh
          rm -rf unpacked
          prefix/bin/boardcast --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-linux
          path: target/package/*.tar.gz
          retention-days: 14

  macos:
    name: macos package (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    # No Mac is at hand during development, so this is what tells whether it builds and starts at all.
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, then Intel.
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # SpeechAnalyzer needs the macOS 26 SDK, which the Intel image may carry beside an older default.
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$xcode" ] || sudo xcode-select -s "$xcode"
          xcrun --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - name: Cache the meeting search model
        uses: actions/cache@v4
        with:
          path: resources/search
          key: search-${{ hashFiles('crates/models/src/lib.rs') }}
      # The script ends by running each packaged app's self-check, and builds and self-tests the Apple speech helper.
      - run: sh packaging/macos/package.sh
        env:
          VARIANTS: all none
      - name: Core crates and speech, with the packaged models
        run: cargo test -p boardcast-board -p boardcast-agent -p boardcast-meetings -p boardcast-models -p boardcast-audio
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/resources/voice
          CARGO_TARGET_DIR: ${{ runner.temp }}/macos-tests
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-${{ matrix.runner }}
          path: target/package/*.zip
          retention-days: 14

  windows:
    name: windows package
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    # No Windows machine is at hand either; this is the first sign of whether it builds and starts.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - name: Cache the meeting search model
        uses: actions/cache@v4
        with:
          path: resources/search
          key: search-${{ hashFiles('crates/models/src/lib.rs') }}
      - run: sh packaging/windows/package.sh
        env:
          VARIANTS: all
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-windows
          path: target/package/*.zip
          retention-days: 14
