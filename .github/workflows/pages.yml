name: Website

# Trunk bundles the WASM assets; crates/site-gen renders the five pages before publication, with the
# download sizes read from the latest release. Requires Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  # Pull requests only build it, so a broken site never reaches main.
  pull_request:
    paths:
      - 'landing/**'
      - 'crates/site/**'
      - 'crates/site-gen/**'
      - 'crates/demo/**'
      - 'crates/board/**'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # A new release changes the download sizes. Release publishes with GITHUB_TOKEN, which starts no
  # `release` event, so the site follows the workflow instead.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Trunk fetches the wasm-bindgen that matches Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the website
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The published page never goes out without its download sizes.
          BOARDCAST_REQUIRE_RELEASE: '1'
        # The demo is a page of its own under demo/, built after the site, which empties dist/ first.
        run: |
          cargo test --locked -p boardcast-site-gen
          trunk build --release
          trunk build demo/index.html --dist dist/demo --release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
