name: Release

# 推 v* tag（一般用 `pnpm release x.y.z --push`）时：
# 1. 用 CHANGELOG.md 里这个版本的那一节当 Release 正文（没有就按上一个 tag 以来的约定式提交现生成），先建成草稿；
# 2. 三个平台各自打包，安装包传到这个 Release 上；
# 3. 三个平台都成功了才正式发布；有一个失败就留在草稿，修好后可以手动重跑。
# 也可以在 Actions 页面手动对已有的 tag 重跑。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  notes:
    name: release notes
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # 要完整历史和 tag，才能找到上一个版本、列出中间的提交
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node 看到 package.json 的 packageManager 会自动给 pnpm 建缓存，可这一步没装 pnpm、也不需要
          package-manager-cache: false
      - name: Write the release notes
        run: |
          # 手动重跑早期的 tag 时，那时候还没有这个脚本，用 main 上的
          script=scripts/changelog.mjs
          if [ ! -f "$script" ]; then
            mkdir -p "$RUNNER_TEMP/scripts"
            git show origin/main:scripts/changelog.mjs > "$RUNNER_TEMP/scripts/changelog.mjs"
            script="$RUNNER_TEMP/scripts/changelog.mjs"
          fi
          node "$script" notes "$TAG" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只有带后缀的版本（-rc.1 之类）标成预发布；0.x 正式版照常是 Latest
          pre=false
          case "$TAG" in *-*) pre=true ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "boardcast $TAG" --notes-file notes.md --prerelease="$pre"
          else
            gh release create "$TAG" --title "boardcast $TAG" --notes-file notes.md --draft --verify-tag --prerelease="$pre"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: build · ${{ matrix.name }}
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          # Apple Silicon；llama-server 用官方的 Metal 版
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      # sherpa-onnx-sys 把下载的预编译库解压在 target/sherpa-onnx-prebuilt/<版本>/lib，只要这个目录在就不再下载。
      # rust-cache 保存前会清理 target/，目录留下了、里面的 .a / .lib 却没了，于是链接时找不到库。
      # 所以每次都删掉这个目录、清掉这个包，让构建脚本重新下载解压（在 Actions 里只要几秒）。
      - name: Fetch the sherpa-onnx prebuilt libs fresh
        shell: bash
        run: |
          rm -rf src-tauri/target/sherpa-onnx-prebuilt
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys --release
      - run: pnpm install --frozen-lockfile
      # 语音模型（约 240 MB）打进安装包；和 CI 共用同一个缓存，命中时不用再下载
      - name: Cache voice models
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: voice-models
          key: voice-sensevoice-2024-07-17-silero-v4-campplus-zh-en
      - name: Download voice models
        if: steps.voice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          hf=https://huggingface.co
          sv=$hf/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          mkdir -p voice-models/voice/sense-voice
          curl -fL --retry 3 -o voice-models/voice/sense-voice/model.int8.onnx $sv/model.int8.onnx
          curl -fL --retry 3 -o voice-models/voice/sense-voice/tokens.txt $sv/tokens.txt
          curl -fL --retry 3 -o voice-models/voice/silero_vad.onnx $hf/csukuangfj/vad/resolve/main/silero_vad.onnx
          curl -fL --retry 3 -o voice-models/zh.wav $sv/test_wavs/zh.wav
          # 声纹模型（区分说话人），和测声纹用的 3D-Speaker 测试音频
          mkdir -p voice-models/voice/speaker
          curl -fL --retry 3 -o voice-models/voice/speaker/campplus_zh_en.onnx $hf/csukuangfj/speaker-embedding-models/resolve/main/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
          for f in speaker1_a_cn_16k speaker1_b_cn_16k speaker2_a_cn_16k; do
            curl -fL --retry 3 -o voice-models/$f.wav https://github.com/csukuangfj/sr-data/raw/main/test/3d-speaker/$f.wav
          done
      # 打包并把安装包传到上一步建好的 Release 上（deb / rpm / AppImage，msi / exe，dmg）
      # 另外生成自动更新用的签名包，tauri-action 汇总成 latest.json 一起传上去（应用里的更新检查读的就是它）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/voice-models
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.notes.outputs.release-id }}
          args: --config src-tauri/tauri.updater.conf.json

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
