<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="qa"></div><script type="module">
import React,{useState} from 'react';
import {createRoot} from 'react-dom/client';
import ModelPanel from '/src/ModelPanel.tsx';
import {models,voice} from '/src/desktop.ts';
import '/src/style.css';
const h=React.createElement,qa=window.qa;
const model=(id,label,kind,extra={})=>({id,label,kind,note:'Fixture model details',size:2e9,installed:true,partial:0,selected:false,recommended:false,...extra});
qa.catalog={freeBytes:50e9,dir:'/fixture/models',models:[model('board','Board model','llm',{selected:true}),model('other','Other board model','llm'),model('board-vision','Vision add-on','vision'),model('voice','Speech recognition model','voice'),model('download','Download model','llm',{installed:false,partial:5e8})]};
const act=async(name)=>{qa.calls.push(name);if(qa.hold===name)await new Promise(resolve=>qa.release=resolve);if(qa.fail===name)throw Error('Injected '+name+' failure')};
models.list=async()=>{await act('list');return structuredClone(qa.catalog)};
models.select=async(id)=>{await act('select');qa.catalog.models.forEach(m=>m.selected=m.id===id)};
models.remove=async(id)=>{await act('remove');const m=qa.catalog.models.find(m=>m.id===id);m.installed=false;if(id==='voice')qa.emit('voice-models-changed',null);if(qa.fail==='remove-partial'){m.partial=5e8;throw Error('Injected partial remove failure')}m.partial=0};
models.download=async(id)=>{await act('download');qa.catalog.downloading=id};
models.cancel=async()=>{await act('pause');delete qa.catalog.downloading;qa.emit('model-progress',{id:'download',state:'canceled',downloaded:5e8,total:2e9,speed:0})};
voice.models=async()=>({selection:{provider:'sensevoice',locale:'auto'},senseVoiceInstalled:qa.catalog.models.find(m=>m.id==='voice').installed,listening:false,preparing:false,autoLocales:[],activeLocale:null,apple:null,appleError:null});
function Fixture(){const[open,setOpen]=useState(false);return h('div',null,h('button',{onClick:()=>setOpen(true)},'Open models'),open&&h(ModelPanel,{status:{state:'ready',gpus:[]},onBeforeRemove:()=>act('save'),onClose:()=>setOpen(false)}))}
createRoot(document.getElementById('qa')).render(h(Fixture));
</script></body></html>
