[package]
name = "boardcast-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "boardcast"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
boardcast-agent.workspace = true
boardcast-audio.workspace = true
boardcast-board.workspace = true
boardcast-export.workspace = true
boardcast-import.workspace = true
boardcast-meetings.workspace = true
boardcast-models.workspace = true
boardcast-search.workspace = true
boardcast-update.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = { version = "=0.9.0", default-features = false, features = ["assets", "component"] }
gpui-kit-assets = "=0.9.0"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde.workspace = true
serde_json.workspace = true
sherpa-onnx = "2.0.1"
sys-locale = "0.3"
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
