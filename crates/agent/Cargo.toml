[package]
name = "alcyo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true



[dependencies]
flate2 = "1"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
anyhow.workspace = true
base64 = "0.22"
alcyo-board.workspace = true
alcyo-models.workspace = true
regex = "1"
serde_json.workspace = true
ureq = { version = "2", features = ["json", "proxy-from-env"] }
# Secrets: the system keychain, or an encrypted file where there is none (settings::secrets).
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Secret Service over D-Bus in pure Rust, so neither building nor running needs libdbus.
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
