name: Website

# Publishes the website, built from crates/site and landing/ with Trunk, at the Pages root. The earlier app's web demo under /demo/ is no longer built (#150).
# Requires Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  # Pull requests only build it, so a broken site never reaches main.
  pull_request:
    paths:
      - 'landing/**'
      - 'crates/site/**'
      - 'crates/demo/**'
      - 'crates/board/**'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Trunk fetches the wasm-bindgen that matches Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the website
        working-directory: landing
        # The demo is a page of its own under demo/, built after the site, which empties dist/ first.
        run: |
          trunk build --release
          trunk build demo/index.html --dist dist/demo --release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
