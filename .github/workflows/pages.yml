name: Web demo

# Publishes the website at the Pages root and the interactive web demo under /demo/.
# The website embeds the demo at the end of the page.
# Requires Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BOARDCAST_BASE: /${{ github.event.repository.name }}/demo/
      - name: Build website and include the demo
        run: |
          pnpm site:build
          pnpm exec tsc -p landing/tsconfig.json --noUnusedLocals --noUnusedParameters
          cp -R dist landing/dist/demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
