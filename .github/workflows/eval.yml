name: Eval

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'
    - cron: '30 2 * * 4'
  workflow_dispatch:
    inputs:
      meeting_asr:
        description: Long multilingual meetings (ASR only)
        type: boolean
        default: false
      full_asr:
        description: The full ASR corpus rather than the quick samples
        type: boolean
        default: false
      model_url:
        description: Board evaluation GGUF URL
        default: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      label:
        description: Board evaluation model label
        default: qwen3.5-4b-q4km-cpu

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_BUILD: b11954
  # Gate on the desktop's recommended model; other candidates can use workflow_dispatch inputs.
  MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf' }}
  LABEL: ${{ inputs.label || 'qwen3.5-4b-q4km-cpu' }}

jobs:
  board:
    name: text to board
    if: github.event_name != 'schedule' && inputs.meeting_asr != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p boardcast-tools
      # The stroke data the layout check measures with.
      - run: target/release/boardcast-tools fetch glyphs

      - name: Cache llama.cpp and model
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/llama
            ~/models
          key: eval-${{ env.LLAMA_BUILD }}-${{ hashFiles('.github/workflows/eval.yml') }}-${{ env.MODEL_URL }}

      - name: Download llama.cpp and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/llama ~/models
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | tar -xz -C ~/llama
          curl -fL --retry 3 -o ~/models/model.gguf "$MODEL_URL"

      - name: Start llama-server
        run: |
          server=$(find ~/llama -type f -name llama-server | head -1)
          chmod +x "$server"
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          mkdir -p eval/reports
          sha256sum ~/models/model.gguf > eval/reports/model-sha256.txt
          nohup "$server" -m ~/models/model.gguf --host 127.0.0.1 --port 8080 -c 4096 --jinja -np 1 > ~/llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          cat ~/llama-server.log
          exit 1

      # The board model as the app runs it. Transcript revisions are not in the GPUI app yet, so
      # eval/revisions.json waits for them (#150).
      - run: target/release/boardcast-tools agent-eval . board-dev.json --llm http://127.0.0.1:8080 --set dev --label "$LABEL"
      - run: target/release/boardcast-tools agent-eval . board-pointing.json --llm http://127.0.0.1:8080 --set pointing --label "$LABEL"
      - name: Summary certainty and template topics
        run: target/release/boardcast-tools summary-eval . --llm http://127.0.0.1:8080 --label "$LABEL" --repeat 3

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-report
          path: |
            eval/reports/
            ~/llama-server.log

  asr:
    name: ASR · ${{ matrix.engine }} · VAD ${{ matrix.vad }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app's own hearing, whose speech checks fail the run; then SenseVoice alone, as controls.
          - { engine: routed, vad: 'on' }
          - { engine: sensevoice, vad: 'on' }
          - { engine: sensevoice, vad: 'off' }
    env:
      ASR_SUITE: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 'meetings' || (github.event_name == 'schedule' || inputs.full_asr == true) && 'full' || 'quick' }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr-linux
      # rust-cache can leave empty native-library directories that sherpa mistakes for a complete download.
      - run: |
          cargo clean -p sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - run: python3 eval/asr/own-voice/test_record.py
      - run: cargo test -p boardcast-asr-eval
      - run: cargo build --release -p boardcast-asr-eval
      - uses: actions/cache@v5
        with:
          path: eval/asr/.data
          key: asr-audio-${{ env.ASR_SUITE }}-${{ hashFiles('eval/asr/corpus.json', 'eval/asr/meetings.json') }}
      - uses: actions/cache@v5
        with:
          path: resources/voice
          key: asr-voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      # The speech models the packages carry.
      - run: cargo run -q --release -p boardcast-tools -- fetch voice
      # Both steps check cached files too: missing or damaged audio must never quietly skip a recording.
      - run: target/release/asr-eval download . --suite "$ASR_SUITE"
      - run: target/release/asr-eval run . --suite "$ASR_SUITE" --engine "${{ matrix.engine }}" --vad "${{ matrix.vad }}" --output "eval/reports/asr/${{ matrix.engine }}-vad-${{ matrix.vad }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: asr-${{ matrix.engine }}-vad-${{ matrix.vad }}
          path: eval/reports/asr/
          if-no-files-found: warn
          retention-days: 30

  asr-comparison:
    name: ASR comparison
    needs: asr
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr-linux
      # rust-cache can leave empty native-library directories that sherpa mistakes for a complete download.
      - run: |
          cargo clean -p sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - run: cargo build --release -p boardcast-asr-eval
      - uses: actions/download-artifact@v7
        with:
          pattern: asr-*
          path: eval/reports/asr-ci
          merge-multiple: true
      - name: Compare the runs
        run: target/release/asr-eval compare eval/reports/asr-ci/*/report.json > eval/reports/asr-ci/comparison.md
      - uses: actions/upload-artifact@v6
        with:
          name: asr-comparison
          path: eval/reports/asr-ci/comparison.md
          retention-days: 30
