[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.29.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Field order is kept: the migration hash must match what JSON.stringify produces.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
boardcast-board = { path = "crates/board" }
boardcast-audio = { path = "crates/audio" }
boardcast-agent = { path = "crates/agent" }
boardcast-meetings = { path = "crates/meetings" }
boardcast-models = { path = "crates/models" }
boardcast-export = { path = "crates/export" }
boardcast-import = { path = "crates/import" }
boardcast-update = { path = "crates/update" }
boardcast-search = { path = "crates/search" }

[profile.dev]
opt-level = 1
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# The website is downloaded by every visitor, so it is built for size.
[profile.release.package.boardcast-site]
opt-level = "s"

[profile.release.package.boardcast-demo]
opt-level = "s"
