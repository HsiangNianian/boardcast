[package]
name = "boardcast-site"
description = "The website, compiled to WebAssembly; landing/ holds its page and styles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomParser",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FontFaceSet",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlImageElement",
  "ImageData",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "MediaQueryList",
  "MouseEvent",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ScrollBehavior",
  "ScrollToOptions",
  "SupportedType",
  "SvgElement",
  "SvgGraphicsElement",
  "SvgRect",
  "Text",
  "Window",
]
