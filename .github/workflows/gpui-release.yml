name: Release GPUI app

# Publishes every package variant (see packaging/models.sh) for Linux and the Mac.
#
# A release is tagged v<version> and marked latest, which is where the updater reads its manifest.
# The manifest is also copied to the rolling `gpui-latest` pre-release, where the alphas looked.
# A pre-release, chosen below, goes only to `gpui-latest`, as the alphas did.
#
# The release stays a draft until every package is up, so nobody downloads half of it. The manifest
# lists Linux packages only, as the updater only installs on Linux; Mac apps are downloaded by hand.
# It is separate from the older app's release workflow and never touches its `latest.json`.
# Run by hand after raising the workspace version.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed, shown in the update prompt and on the release page
        required: true
      prerelease:
        description: Publish to the rolling gpui-latest pre-release instead of a release of its own
        type: boolean
        default: false

permissions:
  contents: write

env:
  LINUX_VARIANTS: full ja en sensevoice
  MAC_VARIANTS: full ja en sensevoice apple

jobs:
  linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - run: sh packaging/linux/package.sh
        env:
          VARIANTS: ${{ env.LINUX_VARIANTS }}
      - id: version
        run: echo "version=$(target/release/boardcast --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that is not newer than the published one
        run: |
          version='${{ steps.version.outputs.version }}'
          # The latest release, then the rolling pre-release.
          for tag in "" gpui-latest; do
            rm -f published.json
            if gh release download $tag --pattern manifest.json --output published.json 2>/dev/null; then
              target/release/boardcast-tools version-newer "$version" "$(jq -r .version published.json)"
            fi
          done
      - name: Sign
        # The older app's update key, so installs already out there accept the packages.
        env:
          BOARDCAST_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BOARDCAST_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: target/release/boardcast-tools sign target/package/boardcast-*-linux*.tar.gz
      # It lists Linux packages only, so it is written here, where the tools are built.
      - name: Write the manifest
        env:
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ '${{ inputs.prerelease }}' = true ]; then tag=gpui-latest; else tag="v$VERSION"; fi
          target/release/boardcast-tools release-manifest target/package "$tag" > target/package/manifest.json
          cat target/package/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/package/boardcast-*-linux*.tar.gz*
            target/package/manifest.json
          retention-days: 3

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - run: sh packaging/macos/package.sh
        env:
          VARIANTS: ${{ env.MAC_VARIANTS }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: target/package/boardcast-*-macos*.zip
          retention-days: 3

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTES: ${{ inputs.notes }}
      VERSION: ${{ needs.linux.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        run: |
          mv packages/manifest.json manifest.json
          if [ "$PRERELEASE" = true ]; then TAG=gpui-latest; else TAG="v$VERSION"; fi
          packages=$(ls packages/boardcast-*.tar.gz packages/boardcast-*.zip)
          if [ "$PRERELEASE" = true ]; then
            gh release view gpui-latest >/dev/null 2>&1 || gh release create gpui-latest --prerelease --title "boardcast on GPUI" --notes "Rolling pre-release of the GPUI app."
            gh release upload gpui-latest $packages --clobber
            # The manifest goes last, so it never points at a package that is not there yet.
            gh release upload gpui-latest manifest.json --clobber
            exit 0
          fi
          printf '%s\n\n' "$NOTES" > notes.md
          cat packaging/release-notes.md >> notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "boardcast $VERSION" --notes-file notes.md
          gh release upload "$TAG" $packages manifest.json
          gh release edit "$TAG" --draft=false --latest
          # Installs from the alphas read their manifest here; it points at this release's packages.
          if gh release view gpui-latest >/dev/null 2>&1; then
            gh release upload gpui-latest manifest.json --clobber
          fi
