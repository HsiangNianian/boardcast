name: Release

# Pushing a tag v<version> publishes every package variant (see packaging/models.sh) for Linux and the Mac:
#   git tag -a v0.23.0 -m "What changed, shown in the update prompt and on the release page"
#   git push origin v0.23.0
# The version must be the workspace's. The tag's message is the notes; a tag without one gets notes
# generated from the merged pull requests. A version with a pre-release part (0.23.0-1) is published
# as a pre-release, which the updater never offers.
#
# A release stays a draft until every package is up, so nobody downloads half of it, and is then marked
# latest, which is where the updater reads its manifest; the manifest is also copied to the rolling
# `gpui-latest` pre-release, where the alphas looked. It lists Linux packages only, as the updater
# only installs on Linux; Mac apps are downloaded by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LINUX_VARIANTS: all ja en
  MAC_VARIANTS: all ja en none
  TAG: ${{ github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Before the long build, so a mistyped tag fails at once.
      - name: Check the tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "the tag $TAG is not the workspace version $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - run: sh packaging/linux/package.sh
        env:
          VARIANTS: ${{ env.LINUX_VARIANTS }}
      - id: version
        run: |
          version=$(target/release/boardcast --version | cut -d' ' -f2)
          [ "v$version" = "$TAG" ] || { echo "the tag $TAG is not the workspace version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      # Checkout leaves out the tag itself, and with it the message.
      - name: Read the notes from the tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" | sed -e '/-----BEGIN PGP SIGNATURE-----/,$d' > target/package/notes.txt
          [ "$(git cat-file -t "$TAG")" = tag ] || : > target/package/notes.txt
          cat target/package/notes.txt
      - name: Refuse a version that is not newer than the published one
        run: |
          version='${{ steps.version.outputs.version }}'
          # The latest release, then the rolling pre-release.
          for tag in "" gpui-latest; do
            rm -f published.json
            if gh release download $tag --pattern manifest.json --output published.json 2>/dev/null; then
              target/release/boardcast-tools version-newer "$version" "$(jq -r .version published.json)"
            fi
          done
      - name: Sign
        # The older app's update key, so installs already out there accept the packages.
        env:
          BOARDCAST_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BOARDCAST_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: target/release/boardcast-tools sign target/package/boardcast-*-linux*.tar.gz
      # It lists Linux packages only, so it is written here, where the tools are built.
      - name: Write the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(cat target/package/notes.txt) target/release/boardcast-tools release-manifest target/package "$TAG" > target/package/manifest.json
          cat target/package/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/package/boardcast-*-linux*.tar.gz*
            target/package/manifest.json
            target/package/notes.txt
          retention-days: 3

  macos:
    strategy:
      matrix:
        # Apple silicon, then Intel.
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # SpeechAnalyzer needs the macOS 26 SDK, which the Intel image may carry beside an older default.
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$xcode" ] || sudo xcode-select -s "$xcode"
          xcrun --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - run: sh packaging/macos/package.sh
        env:
          VARIANTS: ${{ env.MAC_VARIANTS }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ matrix.runner }}
          path: target/package/boardcast-*-macos*.zip
          retention-days: 3

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.linux.outputs.version }}
      PRERELEASE: ${{ needs.linux.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        run: |
          mv packages/manifest.json manifest.json
          packages=$(ls packages/boardcast-*.tar.gz packages/boardcast-*.zip)
          if [ -s packages/notes.txt ]; then
            { cat packages/notes.txt; printf '\n'; cat packaging/release-notes.md; } > notes.md
            notes="--notes-file notes.md"
          else
            cp packaging/release-notes.md notes.md
            notes="--notes-file notes.md --generate-notes"
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --draft --prerelease --verify-tag --title "boardcast $VERSION" $notes
            gh release upload "$TAG" $packages manifest.json
            gh release edit "$TAG" --draft=false
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "boardcast $VERSION" $notes
          gh release upload "$TAG" $packages manifest.json
          gh release edit "$TAG" --draft=false --latest
          # Installs from the alphas read their manifest here; it points at this release's packages.
          if gh release view gpui-latest >/dev/null 2>&1; then
            gh release upload gpui-latest manifest.json --clobber
          fi
