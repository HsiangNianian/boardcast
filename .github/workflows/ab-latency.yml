name: Board latency A/B (#154, temporary)

# Runs the earlier TypeScript engine and the GPUI app's Rust agent against one llama-server on one runner,
# so their latencies compare without the difference between runners. Removed once #154 is settled.

on:
  pull_request:
    paths:
      - '.github/workflows/ab-latency.yml'
  workflow_dispatch:

env:
  LLAMA_BUILD: b11954
  MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
  # The last main with eval/run.ts, before #153 replaced it.
  TS_COMMIT: b063847

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/glyphs.mjs
      - run: cargo build --release -p boardcast-tools
      - name: The TypeScript runner, from before it was removed
        run: git show "$TS_COMMIT:eval/run.ts" > eval/run.ts

      - name: Cache llama.cpp and model
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/llama
            ~/models
          key: ab-${{ env.LLAMA_BUILD }}-${{ env.MODEL_URL }}
      - name: Download llama.cpp and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/llama ~/models
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | tar -xz -C ~/llama
          curl -fL --retry 3 -o ~/models/model.gguf "$MODEL_URL"
      - name: Start llama-server
        run: |
          server=$(find ~/llama -type f -name llama-server | head -1)
          chmod +x "$server"
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          nohup "$server" -m ~/models/model.gguf --host 127.0.0.1 --port 8080 -c 4096 --jinja -np 1 > ~/llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          cat ~/llama-server.log
          exit 1

      # Dev with TypeScript first, pointing with Rust first, so neither always runs on a fresher server.
      - name: dev · TypeScript
        run: node eval/run.ts --label ts --set dev
      - name: dev · Rust
        run: target/release/boardcast-tools agent-eval . rust-dev.json --llm http://127.0.0.1:8080 --set dev --label rust
      - name: pointing · Rust
        run: target/release/boardcast-tools agent-eval . rust-pointing.json --llm http://127.0.0.1:8080 --set pointing --label rust
      - name: pointing · TypeScript
        run: node eval/run.ts --label ts --set pointing

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ab-latency
          path: |
            eval/reports/
            ~/llama-server.log
