name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/build-apple-speech.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/demos/**'
      - 'eval/macos/**'
      - 'eval/asr/corpus.json'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/build-apple-speech.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/demos/**'
      - 'eval/macos/**'
      - 'eval/asr/corpus.json'
      - '.github/workflows/rust.yml'

jobs:
  core:
    name: core crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The window and audio crates run their tests in the package jobs, with native libraries installed.
      - run: python3 eval/macos/test_watch.py
      - run: cargo run -q -p boardcast-tools -- fetch pdfium
      - run: cargo test -p boardcast-board -p boardcast-agent -p boardcast-meetings -p boardcast-models -p boardcast-export -p boardcast-import -p boardcast-update -p boardcast-tools
      - name: Check the recorded boards for layout defects
        run: cargo run --release -p boardcast-tools -- check . --all-demos --tidy

  package:
    name: linux package
    # An older base than developers use, so the package runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev libssl-dev libzstd-dev libfontconfig-dev libfreetype-dev
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      # The script ends by running each packaged app's self-check. A second variant checks the model selection.
      - run: sh packaging/linux/package.sh
        env:
          VARIANTS: all ja
      # Its own target folder: the cache keeps compiled crates but not the speech library they were
      # built against, so rebuilding that crate in the restored folder cannot find it.
      - name: How speech is heard, with the packaged models
        run: cargo test -p boardcast-audio -p boardcast-ui
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/resources/voice
          CARGO_TARGET_DIR: ${{ runner.temp }}/audio-tests
      - name: A waiting recognizer does not block the other audio source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          corpus = json.loads(pathlib.Path('eval/asr/corpus.json').read_text())
          sample = next(s for s in corpus['samples'] if s['id'] == 'en-ami-00')
          with urllib.request.urlopen(corpus['baseUrl'] + '/' + sample['file'], timeout=60) as response:
              audio = response.read(sample['bytes'] + 1)
          assert len(audio) == sample['bytes'] and hashlib.sha256(audio).hexdigest() == sample['sha256']
          pathlib.Path(os.environ['BOARDCAST_AUDIO_TEST_WAV']).write_bytes(audio)
          PY
          cargo test -p boardcast-ui both_sources_can_recognize_while_the_other_is_waiting -- --ignored
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/resources/voice
          BOARDCAST_AUDIO_TEST_WAV: ${{ runner.temp }}/dual-source.wav
          CARGO_TARGET_DIR: ${{ runner.temp }}/audio-tests
      - name: Install from the package and check again
        run: |
          mkdir unpacked
          tar -xzf target/package/boardcast-*-linux.tar.gz -C unpacked
          PREFIX="$PWD/prefix" sh unpacked/*/install.sh
          rm -rf unpacked
          prefix/bin/boardcast --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-linux
          path: target/package/*.tar.gz
          retention-days: 14

  macos:
    name: macos package (${{ matrix.runner }})
    # No Mac is at hand during development, so this is what tells whether it builds and starts at all.
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, then Intel.
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # SpeechAnalyzer needs the macOS 26 SDK, which the Intel image may carry beside an older default.
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$xcode" ] || sudo xcode-select -s "$xcode"
          xcrun --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      # The script ends by running each packaged app's self-check, and builds and self-tests the Apple speech helper.
      - run: sh packaging/macos/package.sh
        env:
          VARIANTS: all none
      - name: Check the Mac measurement tool against the runner process
        run: python3 eval/macos/watch.py --pid $$ --minutes 0.01
      - name: Core crates and speech, with the packaged models
        run: cargo test -p boardcast-board -p boardcast-agent -p boardcast-meetings -p boardcast-models -p boardcast-audio
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/resources/voice
          CARGO_TARGET_DIR: ${{ runner.temp }}/macos-tests
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-${{ matrix.runner }}
          path: target/package/*.zip
          retention-days: 14

  windows:
    name: windows package
    # No Windows machine is at hand either; this is the first sign of whether it builds and starts.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: resources/voice
          key: voice-${{ hashFiles('crates/tools/src/voice_files.rs') }}
      - run: sh packaging/windows/package.sh
        env:
          VARIANTS: all
      - uses: actions/upload-artifact@v4
        with:
          name: boardcast-windows
          path: target/package/*.zip
          retention-days: 14
