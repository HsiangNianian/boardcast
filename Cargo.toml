[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri app stays buildable on its own until the GPUI app replaces it.
exclude = ["src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boardcast-board = { path = "crates/board" }
boardcast-audio = { path = "crates/audio" }
boardcast-agent = { path = "crates/agent" }

[profile.dev]
opt-level = 1
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
