name: Eval

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'
    - cron: '30 2 * * 4'
  workflow_dispatch:
    inputs:
      meeting_asr:
        description: Long multilingual meetings, six candidates + paired dynamic (ASR only)
        type: boolean
        default: false
      full_asr:
        description: Full corpus, SenseVoice + Whisper base, raw + GTCRN, VAD on + off
        type: boolean
        default: false
      asr_sweep:
        description: Compare all ASR candidates by language (quick unless full_asr is also selected)
        type: boolean
        default: false
      model_url:
        description: Board evaluation GGUF URL
        default: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      label:
        description: Board evaluation model label
        default: qwen3.5-4b-q4km-cpu

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_BUILD: b11954
  # Gate on the desktop's recommended model; other candidates can use workflow_dispatch inputs.
  MODEL_URL: ${{ inputs.model_url || 'https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf' }}
  LABEL: ${{ inputs.label || 'qwen3.5-4b-q4km-cpu' }}

jobs:
  check:
    name: typecheck · unit tests · web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Multilingual phonetic labels and commands
        run: pnpm eval:phonetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phonetic-eval
          path: eval/reports/phonetic.*
          if-no-files-found: ignore
      - run: pnpm build

  desktop:
    if: github.event_name != 'schedule' && inputs.meeting_asr != true
    name: desktop · ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          # Apple Silicon；llama-server 用官方的 Metal 版
          - name: macos-arm64
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Compile Apple speech helper
        if: runner.os == 'macOS'
        run: sh scripts/build-apple-speech.sh aarch64-apple-darwin
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      # sherpa-onnx-sys 把下载的预编译库解压在 target/sherpa-onnx-prebuilt/<版本>/lib，只要这个目录在就不再下载。
      # rust-cache 保存前会清理 target/，目录留下了、里面的 .a / .lib 却没了，于是链接时找不到库。
      # 所以每次都删掉这个目录、清掉这个包，让构建脚本重新下载解压（在 Actions 里只要几秒）。
      - name: Fetch the sherpa-onnx prebuilt libs fresh
        shell: bash
        run: |
          rm -rf src-tauri/target/sherpa-onnx-prebuilt
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys --release
      - run: pnpm install --frozen-lockfile
      # 语音模型（约 240 MB）：打包时要放进安装包，Rust 测试也要用真模型和一段测试音频，缓存起来
      - name: Cache voice models
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: voice-models
          key: voice-sensevoice-2024-07-17-silero-v4-campplus-zh-en
      - name: Download voice models
        if: steps.voice-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          hf=https://huggingface.co
          sv=$hf/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          mkdir -p voice-models/voice/sense-voice
          curl -fL --retry 3 -o voice-models/voice/sense-voice/model.int8.onnx $sv/model.int8.onnx
          curl -fL --retry 3 -o voice-models/voice/sense-voice/tokens.txt $sv/tokens.txt
          curl -fL --retry 3 -o voice-models/voice/silero_vad.onnx $hf/csukuangfj/vad/resolve/main/silero_vad.onnx
          curl -fL --retry 3 -o voice-models/zh.wav $sv/test_wavs/zh.wav
          # 声纹模型（区分说话人），和测声纹用的 3D-Speaker 测试音频
          mkdir -p voice-models/voice/speaker
          curl -fL --retry 3 -o voice-models/voice/speaker/campplus_zh_en.onnx $hf/csukuangfj/speaker-embedding-models/resolve/main/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
          for f in speaker1_a_cn_16k speaker1_b_cn_16k speaker2_a_cn_16k; do
            curl -fL --retry 3 -o voice-models/$f.wav https://github.com/csukuangfj/sr-data/raw/main/test/3d-speaker/$f.wav
          done
      # GitHub 的 macOS runner 上，XProtect 偶尔占着刚建好的磁盘镜像，打 .dmg 时 hdiutil 报 Resource busy；先把它停掉
      - name: Stop XProtect so hdiutil can build the .dmg
        if: runner.os == 'macOS'
        run: sudo pkill -9 XProtect >/dev/null 2>&1 || true
      # fetch-voice 发现 BOARDCAST_VOICE_DIR 里的文件校验通过，就直接复制进安装包，不再下载
      # 不要指定 shell: bash：Windows 上会换成 Git Bash 里的 GNU tar，它把 D:\ 当成远程主机
      - run: pnpm tauri build
        env:
          BOARDCAST_VOICE_DIR: ${{ github.workspace }}/voice-models
      # 冒烟测试：打进安装包的 llama-server 在这个平台上能跑起来、能列出设备
      - name: Smoke-test bundled llama-server
        shell: bash
        run: |
          exe=src-tauri/llama/llama-server
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --list-devices
          du -sh src-tauri/llama
      # Rust 测试：模型下载器（假的 HTTP 服务：换源、断线续传、校验失败、取消、磁盘空间），
      # 语音识别（真模型认一段中文、两句话按停顿切开、静音不出字）
      - name: Rust tests
        shell: bash
        run: BOARDCAST_VOICE_DIR="$PWD/voice-models" cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Check Apple Auto language routing on macOS
        if: runner.os == 'macOS'
        env:
          BOARDCAST_AUTO_MODELS: ${{ github.workspace }}/src-tauri
          BOARDCAST_AUTO_AUDIO: ${{ github.workspace }}/eval/asr/.data
        run: |
          node --input-type=module -e "import { corpus, prepareAudio } from './eval/asr/download.mjs'; await prepareAudio({ ...corpus, samples: corpus.samples.filter(s => ['zh-alimeeting-00', 'ja-fleurs-00', 'en-ami-00'].includes(s.id)) });"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib voice::auto::tests::auto_language_real_audio -- --ignored --exact --nocapture
      - name: Check Apple speech helper (no microphone or model download)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          helper = 'src-tauri/target/release/boardcast-speech'
          subprocess.run([helper, 'self-test'], check=True, timeout=30)
          status = json.loads(subprocess.check_output([helper, 'status'], timeout=30))
          assert status['type'] == 'status', status
          assert status['isApple'] is True, status
          assert isinstance(status['available'], bool), status
          assert isinstance(status['locales'], list), status
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
      # 只在 Linux 上跑一次就够：clippy 的告警和平台无关
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --release -- -D warnings
      - uses: actions/upload-artifact@v6
        with:
          name: boardcast-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  board:
    name: text to board
    needs: check
    if: github.event_name != 'schedule' && inputs.meeting_asr != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache llama.cpp and model
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/llama
            ~/models
          key: eval-${{ env.LLAMA_BUILD }}-${{ hashFiles('.github/workflows/eval.yml') }}-${{ env.MODEL_URL }}

      - name: Download llama.cpp and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/llama ~/models
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz" | tar -xz -C ~/llama
          curl -fL --retry 3 -o ~/models/model.gguf "$MODEL_URL"

      - name: Start llama-server
        run: |
          server=$(find ~/llama -type f -name llama-server | head -1)
          chmod +x "$server"
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          nohup "$server" -m ~/models/model.gguf --host 127.0.0.1 --port 8080 -c 4096 --jinja -np 1 > ~/llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          cat ~/llama-server.log
          exit 1

      - run: node eval/run.ts --label "$LABEL"
      - run: node eval/run.ts --label "$LABEL" --set pointing
      - run: node eval/run.ts --label "$LABEL" --set revisions

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-report
          path: |
            eval/reports/
            ~/llama-server.log

  asr-plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - id: matrix
        env:
          MODE: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 'meetings' || (github.event_name == 'schedule' || inputs.asr_sweep == true) && 'sweep' || inputs.full_asr == true && 'full' || 'quick' }}
        run: echo "value=$(node eval/asr/matrix.mjs "$MODE")" >> "$GITHUB_OUTPUT"

  asr:
    name: ASR · ${{ matrix.model }} · ${{ matrix.denoise }} · VAD ${{ matrix.vad }} · ${{ matrix.policy }}
    needs: [check, asr-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.asr-plan.outputs.matrix) }}
    env:
      ASR_SUITE: ${{ (inputs.meeting_asr == true || github.event.schedule == '30 2 * * 4') && 'meetings' || (github.event_name == 'schedule' || inputs.full_asr == true) && 'full' || 'quick' }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev ffmpeg
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: asr-linux
      - name: Refresh sherpa native libraries
        run: |
          rm -rf src-tauri/target/sherpa-onnx-prebuilt
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: eval/asr/.data
          key: asr-audio-${{ env.ASR_SUITE }}-${{ hashFiles('eval/asr/corpus.json', 'eval/asr/meetings.json') }}
      - uses: actions/cache@v5
        with:
          path: |
            src-tauri/voice
            eval/asr/.models
          key: asr-models-${{ matrix.model }}-${{ matrix.denoise }}-${{ hashFiles('eval/asr/models.json', 'scripts/fetch-voice.mjs') }}
      # Both commands verify cached files too. Missing/corrupt data must never silently skip inference.
      - name: Evaluate the desktop voice engine
        if: ${{ !startsWith(matrix.model, 'wav2vec2-') }}
        run: pnpm eval:asr --suite "$ASR_SUITE" --model "${{ matrix.model }}" --denoise "${{ matrix.denoise }}" --vad "${{ matrix.vad }}" --policy "${{ matrix.policy }}"
      - name: Check Apple Auto language routing with real audio
        if: matrix.model == 'sensevoice' && matrix.denoise == 'none' && matrix.vad == 'on' && matrix.policy == 'static' && env.ASR_SUITE != 'meetings'
        env:
          BOARDCAST_AUTO_MODELS: ${{ github.workspace }}/src-tauri
          BOARDCAST_AUTO_AUDIO: ${{ github.workspace }}/eval/asr/.data
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib voice::auto::tests::auto_language_real_audio -- --ignored --exact --nocapture
      - uses: astral-sh/setup-uv@v6
        if: startsWith(matrix.model, 'wav2vec2-')
        with:
          enable-cache: false
      - name: Evaluate CTC on desktop VAD intervals
        if: startsWith(matrix.model, 'wav2vec2-')
        run: |
          uv run --locked --script eval/asr/ctc.py --self-test
          pnpm eval:asr --suite "$ASR_SUITE" --model "${{ matrix.model }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: asr-${{ matrix.model }}-${{ matrix.denoise }}-vad-${{ matrix.vad }}-${{ matrix.policy }}
          path: eval/reports/asr/
          if-no-files-found: warn
          retention-days: 30

  asr-comparison:
    name: ASR language comparison
    needs: asr
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: asr-*
          path: eval/reports/asr-ci
          merge-multiple: true
      - name: Compare matching corpus results
        run: node eval/asr/compare.mjs eval/reports/asr-ci > eval/reports/asr-ci/comparison.md
      - uses: actions/upload-artifact@v6
        with:
          name: asr-comparison
          path: eval/reports/asr-ci/comparison.md
          retention-days: 30
