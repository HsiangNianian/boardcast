# 安全修复：这些都是 @excalidraw/excalidraw 带进来的间接依赖（经 mermaid、chevrotain 等），
# 上游锁死了有漏洞的版本，Dependabot 改不动，只能在这里强制升级到已修复的版本。
overrides:
  'katex@<0.18.2': 0.18.11
  'lodash-es@<=4.17.23': 4.18.1
  'nanoid@<3.3.18': 3.3.20
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  # hersheytext 只在 scripts/glyphs.mjs 里读它自带的字体 JSON，用不到它解析 SVG 的那部分，
  # 去掉 cheerio，连带去掉它依赖的、没有修复版的 lodash.pick（Dependabot #16）
  'hersheytext>cheerio': '-'
