[package]
name = "alcyo-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alcyo-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
alcyo-agent.workspace = true
alcyo-board.workspace = true
alcyo-keep.workspace = true
alcyo-export.workspace = true
alcyo-import.workspace = true
alcyo-meetings.workspace = true
alcyo-models.workspace = true
alcyo-search.workspace = true
flate2 = "1"
minisign = "0.7"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["proxy-from-env"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
alcyo-update.workspace = true
