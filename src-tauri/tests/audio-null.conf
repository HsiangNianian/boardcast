# Dedicated input-selection fixture. Both named and default devices discard audio.
# CPAL/ALSA enumerates card metadata before reading the virtual PCM hints.
ctl.hw {
    @args [ CARD ]
    @args.CARD { type string }
    type hw
    card $CARD
}
pcm.!default {
    type null
}
pcm.boardcast_input_qa {
    type null
    hint {
        show on
        description "Boardcast Input QA 中文"
        ioid "Input"
    }
}
