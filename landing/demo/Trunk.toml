# The web demo, for local development: `trunk serve` from this folder while the site runs, and the site's server
# passes /demo/ on to this one. The release build lives in pages.yml, under the site's dist/.
[build]
target = "index.html"
dist = "../dist-demo"
public_url = "/demo/"

[watch]
watch = [".", "../../crates/demo", "../../crates/board", "../../crates/site-gen"]

[serve]
port = 1431

[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "--locked", "--package", "boardcast-site-gen"]
