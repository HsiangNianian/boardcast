[package]
name = "alcyo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alcyo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
alcyo-agent.workspace = true
alcyo-audio.workspace = true
alcyo-board.workspace = true
alcyo-export.workspace = true
alcyo-fonts.workspace = true
alcyo-share.workspace = true
alcyo-import.workspace = true
alcyo-meetings.workspace = true
alcyo-models.workspace = true
alcyo-search.workspace = true
alcyo-update.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fluent-bundle = "0.15"
gpui-kit = { version = "=0.9.0", default-features = false, features = ["assets", "component"] }
gpui-kit-assets = "=0.9.0"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
sherpa-onnx = "2.0.1"
sys-locale = "0.3"
tiny-skia = "0.11"
unic-langid = "0.9"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
