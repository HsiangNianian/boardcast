name: Release

# 推 v* tag 时三平台打包，挂到一个草稿 Release 上，确认后手动发布。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys 把下载的预编译库放在 target/sherpa-onnx-prebuilt/，rust-cache 默认不缓存这里，
      # 却会恢复它的构建脚本结果，于是 cargo 以为库已经就位、链接时找不到。
      # 先清掉这个包，让构建脚本每次都确认一遍库在不在（在就不重新下载）。
      - name: Make sure the sherpa-onnx prebuilt libs are present
        shell: bash
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-onnx-sys --release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: boardcast ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
